{% extends "base.html" %}
{% block title %}Login — AI Research Agent{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card glass">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to access your research dashboard</p>
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control"
               placeholder="Enter username or email" value="{{ identifier|default('') }}" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In →</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
