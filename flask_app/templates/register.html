{% extends "base.html" %}
{% block title %}Register — AI Research Agent{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card glass">
    <h1>Create Account</h1>
    <p class="subtitle">Join the research community</p>
    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="Choose a username" value="{{ username|default('') }}" required autofocus minlength="3" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@example.com" value="{{ email|default('') }}" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="At least 6 characters" required minlength="6" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               placeholder="Repeat your password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account →</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
